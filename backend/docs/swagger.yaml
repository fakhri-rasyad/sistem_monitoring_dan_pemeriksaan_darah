basePath: /
definitions:
  dto.AlergiCreate:
    properties:
      nama:
        type: string
    type: object
  dto.AlergiPasienCreate:
    properties:
      alergi_public_id:
        type: string
      public_id:
        type: string
    type: object
  dto.DataLabCreate:
    properties:
      nilai:
        type: number
      parameter_public_id:
        type: string
    type: object
  dto.KomposisiTubuhCreate:
    properties:
      air_tubuh:
        type: number
      berat_badan:
        type: number
      indeks_massa_tubuh:
        type: number
      massa_lemak:
        type: number
      massa_otot:
        type: number
      massa_tulang:
        type: number
      tinggi_badan:
        type: number
    type: object
  dto.KunjunganCreate:
    properties:
      tanggal:
        type: string
      tensi_diastol:
        type: integer
      tensi_sistol:
        type: integer
    type: object
  dto.PantanganCreate:
    properties:
      nama:
        type: string
    type: object
  dto.PantanganPasienCreate:
    properties:
      pantangan_public_id:
        type: string
      public_id:
        type: string
    type: object
  dto.ParameterPemeriksaanDarahCreate:
    properties:
      nama:
        type: string
      satuan:
        type: string
    type: object
  dto.PasienCreate:
    properties:
      alamat:
        type: string
      email:
        type: string
      nama:
        type: string
      nomor_hp:
        type: string
      pekerjaan_public_id:
        type: string
      tanggal_lahir:
        type: string
      tempat_lahir:
        type: string
    type: object
  dto.PasienReference:
    properties:
      pasien_create:
        $ref: '#/definitions/dto.PasienCreate'
      pasien_public_id:
        type: string
    type: object
  dto.PekerjaanCreate:
    properties:
      nama:
        type: string
    type: object
  dto.PemeriksaanCreate:
    properties:
      diperiksa_at:
        type: string
      evaluasi:
        type: string
      objective:
        type: string
      planning_terapi:
        type: string
      subjective:
        type: string
    type: object
  dto.SubmissionCreate:
    properties:
      alergi_pasiens:
        items:
          $ref: '#/definitions/dto.AlergiPasienCreate'
        type: array
      data_labs:
        items:
          $ref: '#/definitions/dto.DataLabCreate'
        type: array
      komposisi_tubuh:
        $ref: '#/definitions/dto.KomposisiTubuhCreate'
      kunjungan:
        $ref: '#/definitions/dto.KunjunganCreate'
      pantangan_pasiens:
        items:
          $ref: '#/definitions/dto.PantanganPasienCreate'
        type: array
      pasien:
        $ref: '#/definitions/dto.PasienReference'
      pemeriksaan:
        $ref: '#/definitions/dto.PemeriksaanCreate'
    type: object
  utils.CreationSuccessResponse:
    properties:
      data: {}
      message:
        example: Sukses menambahkan X
        type: string
      status:
        example: 201 Creation Success
        type: string
      status_code:
        example: 201
        type: integer
    type: object
  utils.Response:
    properties:
      data: {}
      error:
        type: string
      message:
        type: string
      status:
        type: string
      statusCode:
        type: integer
    type: object
externalDocs:
  description: OpenAPI
  url: https://swagger.io/resources/open-api/
host: localhost:3200
info:
  contact:
    email: support@swagger.io
    name: API Support
    url: http://www.swagger.io/support
  description: API untuk sistem integrasi monitoring dan logging hasil pemeriksaan
    darah
  license:
    name: Apache 2.0
    url: http://www.apache.org/licenses/LICENSE-2.0.html
  termsOfService: http://swagger.io/terms/
  title: Blood checkup monitoring system
  version: "1.0"
paths:
  /api/v1/alergi:
    get:
      consumes:
      - application/json
      description: Endpoint penambahan alergi
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/utils.Response'
      summary: CreateAlergi
      tags:
      - Checkup
    post:
      consumes:
      - application/json
      description: Endpoint penambahan alergi
      parameters:
      - description: Data alergi
        in: body
        name: alergi
        required: true
        schema:
          $ref: '#/definitions/dto.AlergiCreate'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/utils.CreationSuccessResponse'
      summary: CreateAlergi
      tags:
      - Checkup
  /api/v1/checkup:
    post:
      consumes:
      - application/json
      description: Endpoint checkup data
      parameters:
      - description: Data checkup
        in: body
        name: submit
        required: true
        schema:
          $ref: '#/definitions/dto.SubmissionCreate'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            type: string
      summary: CreateSubmission
      tags:
      - Checkup
  /api/v1/kunjungan:
    get:
      consumes:
      - application/json
      description: Endpoint penambahan Kunjungan
      parameters:
      - description: Public ID Kunjungan
        in: path
        name: public_id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/utils.CreationSuccessResponse'
      summary: GetKunjunganByPublicID
      tags:
      - Kunjungan
  /api/v1/pantangan:
    get:
      consumes:
      - application/json
      description: Endpoint penambahan Pantangan
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/utils.Response'
      summary: CreatePantangan
      tags:
      - Pantangan
    post:
      consumes:
      - application/json
      description: Endpoint penambahan Pantangan
      parameters:
      - description: Data Pantangan
        in: body
        name: Pantangan
        required: true
        schema:
          $ref: '#/definitions/dto.PantanganCreate'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/utils.CreationSuccessResponse'
      summary: CreatePantangan
      tags:
      - Pantangan
  /api/v1/pasien:
    get:
      consumes:
      - application/json
      description: Endpoint penambahan Pasien
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/utils.Response'
      summary: CreatePasien
      tags:
      - Pasien
    post:
      consumes:
      - application/json
      description: Endpoint penambahan Pasien
      parameters:
      - description: Data Pasien
        in: body
        name: Pasien
        required: true
        schema:
          $ref: '#/definitions/dto.PasienCreate'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/utils.CreationSuccessResponse'
      summary: CreatePasien
      tags:
      - Pasien
  /api/v1/pekerjaan:
    get:
      consumes:
      - application/json
      description: Endpoint penambahan Pekerjaan
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/utils.Response'
      summary: CreatePekerjaan
      tags:
      - Pekerjaan
    post:
      consumes:
      - application/json
      description: Endpoint penambahan Pekerjaan
      parameters:
      - description: Data Pekerjaan
        in: body
        name: Pekerjaan
        required: true
        schema:
          $ref: '#/definitions/dto.PekerjaanCreate'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/utils.CreationSuccessResponse'
      summary: CreatePekerjaan
      tags:
      - Pekerjaan
  /api/v1/ppdh:
    get:
      consumes:
      - application/json
      description: Endpoint penambahan ParameterPemeriksaanDarah
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/utils.Response'
      summary: CreateParameterPemeriksaanDarah
      tags:
      - Parameter Pemeriksaan Darah
    post:
      consumes:
      - application/json
      description: Endpoint penambahan ParameterPemeriksaanDarah
      parameters:
      - description: Data ParameterPemeriksaanDarah
        in: body
        name: ParameterPemeriksaanDarah
        required: true
        schema:
          $ref: '#/definitions/dto.ParameterPemeriksaanDarahCreate'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/utils.CreationSuccessResponse'
      summary: CreateParameterPemeriksaanDarah
      tags:
      - Parameter Pemeriksaan Darah
securityDefinitions:
  ApiKeyAuth:
    description: Type "Bearer" followed by a space and JWT token.
    in: header
    name: Authorization
    type: apiKey
swagger: "2.0"
